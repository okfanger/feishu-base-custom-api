[project]
name = "feishu-base-agent"
version = "0.1.0"
description = "飞书多维表格 AI 插件：文本/图片/视频生成 + 网页爬取"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.7",
    "pyyaml>=6",
    "httpx>=0.27",
    "pi-py-agent-core>=0.84.1,<0.85",
    "crawl4ai==0.9.2",
]

[project.scripts]
feishu-base-agent = "feishu_base_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feishu_base_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/feishu_base_agent/static" = "feishu_base_agent/static"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
